astra_db:
  collection_name: "ecommercedata"

embedding_model:
  # provider: "google"
  # model_name: "models/text-embedding-004"
  provider: "hf"
  model_name: "intfloat/e5-large-v2"
  device: "cpu" # "cuda" or "cpu" (optional)

retriever:
  top_k: 4

llm:
  groq:
    provider: "groq"
    model_name: "llama-3.3-70b-versatile"
    temperature: 0
    max_output_tokens: 2048

  google:
    provider: "google"
    model_name: "gemini-2.5-flash"
    temperature: 0
    max_output_tokens: 2048

  openai:
     provider: "openai"
     model_name: "gpt-4o"
     temperature: 0
